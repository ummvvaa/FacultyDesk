<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список категорий</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }
        header { padding: 15px 0; background-color: #007bff; color: white; }
        header .container { display: flex; justify-content: flex-end; }
        header a { color: white; margin-left: 20px; text-decoration: none; font-weight: 500; }
        header a:hover { text-decoration: underline; }

        .category-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.25s ease;
            border: 1px solid rgba(0,0,0,0.05);
            height: 100%;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }

        .category-link {
            color: #007bff;
            font-weight: 600;
            font-size: 18px;
        }

        .category-meta {
            font-size: 14px;
            color: #6c757d;
        }

    </style>
</head>
<body>

<header>
    <div class="container">
        <a href="/me">Профиль</a>
        <a href="/events">События</a>
        <a href="/record">Создать запись</a>
        <a href="/favorites">Избранное</a>
        <a href="/logout">Выйти</a>
    </div>
</header>

<div class="container mt-4">
    <h2 class="text-center mb-4">Все категории</h2>
    <form method="get" class="mb-4">

        <div class="form-row">

            <div class="col-md-3 mb-2">
                <input type="number" class="form-control"
                       name="min"
                       placeholder="Мин. отчётов"
                       th:value="${min}">
            </div>

            <div class="col-md-3 mb-2">
                <input type="date" class="form-control"
                       name="updated_after"
                       th:value="${updated_after != null ? #temporals.format(updated_after, 'yyyy-MM-dd') : ''}">
            </div>

            <div class="col-md-2 mb-2">
                <button class="btn btn-primary btn-block">Фильтровать</button>
            </div>

        </div>

    </form>

    <div th:if="${categories.size() == 0}">
        <p class="text-center">Пока нет категорий.</p>
    </div>

    <div class="row">
        <div class="col-lg-3 col-md-4 col-sm-6 mb-4" th:each="category : ${categories}">
            <a th:href="@{'/categories/' + ${category.id}}" style="text-decoration: none;">
                <div class="category-card text-center p-4">

                    <h5 class="category-link" th:text="${category.name}">Категория</h5>

                    <div class="category-meta mt-3">
                        <div>
                            📄 Отчётов:
                            <span th:text="${recordsCountMap[category.id]}">0</span>
                        </div>

                        <div th:if="${lastUpdatedMap[category.id] != null}">
                            🕒 Последнее изменение:
                            <span th:text="${#dates.format(lastUpdatedMap[category.id], 'dd.MM.yyyy')}">—</span>
                        </div>

                        <div th:if="${lastUpdatedMap[category.id] == null}">
                            🕒 Нет записей
                        </div>
                    </div>

                </div>
            </a>
        </div>
    </div>
</div>

</body>
</html>
