<!DOCTYPE html>
<html lang="en">
<head>
    <title>Регистрация</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-signup {
            max-width: 380px;
            padding: 15px 35px 45px;
            margin: 0 auto;
            background-color: #fff;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .form-signup-heading {
            margin-bottom: 30px;
        }

        .wrapper {
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .form-control {
            position: relative;
            font-size: 16px;
            height: auto;
            padding: 10px;
            margin-bottom: 20px;

            &:focus {
                z-index: 2;
            }
        }


        input[type="password"] {
            margin-bottom: 20px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
        nput[type="text"], input[type="email"], input[type="password"] {
            margin-bottom: 20px;
            border-radius: 0;
        }

        header {
            padding: 15px 0;
            background-color: #007bff;
            color: white;
        }
        header .container {
            display: flex;
            justify-content: flex-end;
        }
        header a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 500;
        }
        header a:hover {
            text-decoration: underline;
        }
    </style>
    <head>


<body>

<header>
    <div class="container">
        <div class="private">
            <a href="login">Войти</a>
            <a href="register">Регистрация</a>
        </div>
    </div>
</header>
<div class="wrapper">
    <form class="form-signup" action="/register" method="POST">
        <h2 class="form-signup-heading" style="text-align: center">Регистрация</h2>
        <input type="email" class="form-control" name="username" placeholder="username" required />
        <input type="password" class="form-control" id="password" name="password" placeholder="password" required />
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="confirm password" required />

        <div id="password_error" style="color:#ff0000; display:none;">Пароли не совпадают!</div>

        <button class="btn btn-lg btn-primary btn-block" type="submit">Регистрация</button>
    </form>

</div>



    <script>

            document.querySelector('.form-signup').addEventListener('submit', function(event) {
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm_password').value;
                if (password !== confirmPassword) {
                    event.preventDefault();
                    document.getElementById('password_error').style.display = 'block';
                }
            });


    </script>
</body>

</html>
